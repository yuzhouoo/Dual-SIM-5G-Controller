name: Build Standalone LSPosed APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK, Build Tools and NDK
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build ARM64 DMS probe with Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          test -x "$CLANG"
          mkdir -p app/src/main/assets
          "$CLANG" -O2 -Wall -Wextra -fPIE -pie -o app/src/main/assets/dms_probe_arm64 native/qmi_dms_probe.c
          test -s app/src/main/assets/dms_probe_arm64
          file app/src/main/assets/dms_probe_arm64
          file app/src/main/assets/dms_probe_arm64 | grep -q 'ELF 64-bit LSB pie executable, ARM aarch64'
      - name: Compile APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Verify DMS executable is packaged inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z -1 "$APK" | grep -qx 'assets/dms_probe_arm64'
          unzip -p "$APK" assets/dms_probe_arm64 > /tmp/dms_probe_from_apk
          head -c 4 /tmp/dms_probe_from_apk | od -An -tx1 | grep -qi '7f 45 4c 46'
          echo 'PASS: ARM64 ELF DMS probe is bundled in APK assets.'
      - name: Upload compiler logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DualSim5G-build-log
          path: build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: DualSim5G-Standalone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
