plugins { id 'com.android.application' }
android {
    namespace 'dev.dual5g'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.dual5g'
        minSdk 31
        targetSdk 28 // Restricted system process hook; avoids unrelated Android 14 receiver changes.
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly 'de.robv.android.xposed:api:82' }
